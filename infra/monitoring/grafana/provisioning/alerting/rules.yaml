# Grafana unified alerting, provisioned. Four rules that matter for a
# one-person lab (roadmap phase 5). UI-ONLY: no contact point or notification
# policy is provisioned, so these use Grafana's default policy — they show in
# Alerting and on panels but send nothing outward. Wiring a real channel later
# is a one-file add (a contact point + a route).

apiVersion: 1

groups:
  - orgId: 1
    name: lab
    folder: Monitoring
    interval: 1m
    rules:
      # ---- disk almost full (>80% used on a real filesystem) --------------
      - uid: disk-almost-full
        title: DiskAlmostFull
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is over 80% full"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * (1 - node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"}
                / node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # ---- a ZFS pool is filling up ---------------------------------------
      # DiskAlmostFull cannot see this and never will: VM disks are zvols and
      # snapshots are neither files nor filesystems, so node_filesystem_* counts
      # neither, and `/` on the hypervisor reports gigabytes free while rpool
      # fills. The metric comes from the textfile collector on the Proxmox host
      # (proxmox-setup.md Part 10) because node_exporter's own zfs collector
      # exposes ARC stats and per-pool I/O, not capacity.
      #
      # 80% matches DiskAlmostFull, and is a real threshold rather than a round
      # number: ZFS write performance degrades once a pool passes it.
      #
      # No staleness rule beside this one, deliberately. A textfile that stops
      # being written keeps being served, so a dead script would freeze this
      # value looking healthy — but the script that writes it also pushes the
      # Uptime Kuma heartbeat, so the deadman there covers it.
      - uid: zfs-pool-almost-full
        title: ZfsPoolAlmostFull
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is over 80% allocated"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: >-
                100 * zfs_pool_allocated_bytes / zfs_pool_size_bytes
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }

      # ---- a scrape target is down ----------------------------------------
      # Known blind spot: if ALLOY ITSELF dies, `up` goes stale and the query
      # returns NoData -> OK, so this never fires for the most total failure.
      # Accepted while alerts are UI-only (a dead collector is obvious from an
      # empty Grafana); when a real notification channel lands, flip
      # noDataState to Alerting for this one rule.
      - uid: service-down
        title: ServiceDown
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) is down"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: up
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ---- wildcard cert failing to renew ---------------------------------
      # Traefik renews the 90-day cert at 30 days remaining, so a healthy cert
      # never drops below ~30d. Under 21d = renewal has been failing over a
      # week, 3 weeks left to fix.
      - uid: cert-expiring
        title: CertExpiringSoon
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "A TLS certificate expires in under 21 days"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: (traefik_tls_certs_not_after - time()) / 86400
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [21] }
