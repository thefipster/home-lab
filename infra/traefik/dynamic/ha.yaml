# Home Assistant — the lab's only file-provider router.
#
# HA runs on its OWN VM, so there is no container here for the Docker provider to
# read labels from. Hence this file. ha.thefipster.de resolves to the INFRA VM,
# and Traefik proxies onward — see docs/reference/dns-records.md.
#
# PORT 80, NOT 8123. Home Assistant 2026.8 made port 80 the default for NEW
# HAOS installations, which is the only kind this repo describes. The port is a
# UI setting now (Settings > System > Network), not `http.server_port` in YAML.
# A backend of :8123 dials a port nothing is listening on and 502s every
# request — the first symptom of this change, and the reason the URL below
# carries no port at all.
#
# TWO NAMES, ONE MACHINE, and they are not interchangeable:
#   ha.thefipster.de             -> the INFRA VM. The SERVICE, what browsers
#                                   use. TLS terminated there.
#   homeassistant.thefipster.de  -> the HA VM. The MACHINE, the backend below.
#                                   Plain HTTP, LAN only.
# Do NOT be tempted to write the backend as http://ha.thefipster.de. That name
# resolves to the infra VM — Traefik itself — and since the move to port 80 it
# no longer fails cleanly: Traefik would dial its OWN web entrypoint, which
# redirects to HTTPS, and the request loops instead of 502-ing. Moving off 8123
# made this mistake worse, not better. The public name belongs to the front door
# and cannot also mean the back end.
#
# homeassistant.thefipster.de needs an EXACT record: the *.thefipster.de wildcard
# answers with the APPS VM, which is the wrong box. (Contrast apps.thefipster.de,
# which needs no record precisely because the wildcard's answer is right.) This
# used to fail loudly — nothing on the apps VM listened on 8123, so you got
# connection-refused. On port 80 it is QUIET: Coolify's proxy answers, and a
# browser test of the bare name returns a real page from the wrong machine.
# Verify the record itself rather than trusting that the name loads.
#
# No TLS section: the websecure entrypoint's tls.domains wildcard in
# compose.yaml covers every router on it, this one included. Adding a resolver
# or a domain here would be the mistake the routing convention exists to
# prevent.
#
# WebSocket upgrade needs no configuration — Traefik passes it through, which
# is what makes the HA frontend work at all.
#
# DELIBERATELY NO `middlewares` KEY. Home Assistant has no OIDC, so the SSO
# convention would point at the authentik@docker forward-auth middleware. It is
# not applied: forward-auth breaks the companion mobile app, webhooks and every
# local API caller, and the break-glass would be editing this file over SSH
# mid-incident in a house whose lights just stopped responding. HA keeps its own
# local login — a stated exception, alongside Vaultwarden and Uptime Kuma:
# see docs/reference/sso-applications.md.

http:
  routers:
    ha:
      rule: Host(`ha.thefipster.de`)
      entrypoints: websecure
      service: ha

  services:
    ha:
      loadBalancer:
        servers:
          # Plain HTTP over the LAN, terminated with TLS by Traefik above.
          # By NAME, not by IP: Traefik re-resolves per dial, so an HA VM address
          # change corrects itself here with no edit. Same reasoning as Alloy's
          # scrape targets in infra/monitoring/alloy/config.alloy.
          # No port: HAOS serves :80 since 2026.8 (see the header). If this
          # instance was set to a different port in Settings > System > Network,
          # this is the one line that has to agree with it.
          - url: http://homeassistant.thefipster.de
