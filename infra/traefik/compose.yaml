# Traefik — reverse proxy + TLS termination for the INFRA VM.
#
# One wildcard certificate (thefipster.de + *.thefipster.de) from Let's
# Encrypt via the DNS-01 challenge against the netcup DNS API. Nothing is
# exposed to the internet: DNS-01 needs no inbound connectivity, and the
# public zone never holds A records for the lab (see docs/traefik-setup.md).
#
# Routing is label-based: stacks join the external `proxy` network and add
# traefik.* labels (see infra/forgejo & infra/dockge). Port 80 only redirects
# to HTTPS.
#
# Deploy (on the infra VM): scripts/init-traefik.sh, then fill in .env and
# `docker compose up -d` (or start it from Dockge).

name: traefik

services:
  traefik:
    image: traefik:v3            # pin the major; same policy as other stacks
    restart: unless-stopped
    command:
      # --- logging ---------------------------------------------------------
      # Traefik defaults to ERROR, which is completely silent in normal
      # operation — INFO makes startup and ACME issuance visible in the logs,
      # which the setup guide relies on.
      - --log.level=INFO
      # --- providers -------------------------------------------------------
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      # --- entrypoints -----------------------------------------------------
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Every websecure router gets TLS from the letsencrypt resolver and is
      # covered by the one wildcard cert below — no per-router TLS labels.
      # Declaring the domains at the ENTRYPOINT also means Traefik requests
      # the wildcard proactively at STARTUP — no router needs to exist first.
      # Wildcard ONLY, no apex SAN: apex + wildcard need two TXT records at
      # the same FQDN (_acme-challenge), and netcup's non-atomic zone updates
      # race on that — one value gets clobbered and validation times out.
      # Nothing is served at the bare apex, so the wildcard alone suffices.
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=*.thefipster.de
      # --- API / dashboard -------------------------------------------------
      # Exposed at traefik.thefipster.de, but ONLY because Authentik forward
      # auth gates it (see the labels below). Never expose the dashboard raw.
      - --api=true
      - --api.dashboard=true
      # --- ACME (Let's Encrypt via netcup DNS-01) --------------------------
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=netcup
      # Check propagation against netcup's AUTHORITATIVE nameservers, not a
      # recursive resolver. Public resolvers (1.1.1.1/8.8.8.8) negative-cache
      # an "empty" answer if queried before netcup publishes the record, then
      # keep serving that cached nothing past the timeout; the LAN's UDR would
      # blackhole the TXT lookup via the split-horizon wildcard. Authoritative
      # servers answer for the zone directly with no cache — this is also
      # exactly what Let's Encrypt sees. (Verify yours match:
      # `dig NS thefipster.de +short`.)
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=root-dns.netcup.net:53,second-dns.netcup.net:53,third-dns.netcup.net:53
      # Production CA is the default — first bring-up goes STRAIGHT to it,
      # one challenge total. If issuance keeps FAILING, don't hammer
      # production (≈5 failed validations/hostname/hour): uncomment the
      # staging caserver below and debug under its loose rate limits, then
      # switch back by re-commenting, deleting acme.json and
      # `docker compose up -d --force-recreate`. See docs/traefik-setup.md.
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    environment:
      NETCUP_CUSTOMER_NUMBER: ${NETCUP_CUSTOMER_NUMBER:?set in .env}
      NETCUP_API_KEY: ${NETCUP_API_KEY:?set in .env}
      NETCUP_API_PASSWORD: ${NETCUP_API_PASSWORD:?set in .env}
      # netcup's nameservers publish TXT records slowly (often ~10 min).
      # Without a generous window, first issuance fails on propagation checks.
      NETCUP_PROPAGATION_TIMEOUT: "900"
      NETCUP_POLLING_INTERVAL: "30"
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.thefipster.de`)
      traefik.http.routers.dashboard.entrypoints: websecure
      # api@internal is Traefik's built-in dashboard service.
      traefik.http.routers.dashboard.service: api@internal
      # Gate it behind Authentik. Middleware + this host's outpost router live
      # on the Authentik `server` container. Break-glass: comment this line.
      traefik.http.routers.dashboard.middlewares: authentik@docker
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only socket: Traefik only watches containers/labels.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # acme.json (account key + certs) lives here — survives recreation.
      - /opt/traefik/letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    external: true
