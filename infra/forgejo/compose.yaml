name: forgejo

services:
  # ---------------------------------------------------------------------------
  # Postgres backing Forgejo, with a dedicated `forgejo` database.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      # Generated into .env by scripts/init-forgejo.sh. NOTE: Postgres keeps the
      # password its data dir was FIRST initialized with — on an existing
      # deployment .env must hold that value (or rotate it via ALTER USER).
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD:?set FORGEJO_DB_PASSWORD in .env — run scripts/init-forgejo.sh}
      POSTGRES_DB: forgejo
      # Postgres 18 made the image's default PGDATA version-specific
      # (/var/lib/postgresql/18/docker) and moved the VOLUME up to
      # /var/lib/postgresql. Pinning it back to the flat path keeps
      # /opt/forgejo/postgres holding PGDATA directly — and makes a future
      # major bump fail LOUDLY ("database files are incompatible with server")
      # instead of silently initializing an empty 19/ dir beside the old data.
      PGDATA: /var/lib/postgresql/data
    volumes:
      # Bind mount under /opt so the DB files are easy to find and back up.
      - /opt/forgejo/postgres:/var/lib/postgresql/data
    networks:
      - forgejo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Forgejo itself. Actions is enabled via env. The registry is built in and
  # served on the same port as the web UI (3000) — no separate service needed —
  # reached via Traefik at https://git.thefipster.de.
  # ---------------------------------------------------------------------------
  forgejo:
    # Pinned to the LTS track, NOT to the latest stable major. Forgejo's
    # non-LTS majors carry a ~3-month support window (16 is dated 2026-10-29)
    # while 15 runs to 2027-07-15. This lab is bumped when someone sits down to
    # bump it, not on a release cadence, so the number here will normally LAG
    # the newest release — that is the policy, not neglect. Check which major
    # is LTS at https://forgejo.org/releases/ before raising it.
    image: codeberg.org/forgejo/forgejo:15
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD:?set FORGEJO_DB_PASSWORD in .env — run scripts/init-forgejo.sh}
      # Enable the Actions feature (needs a registered runner to do anything)
      FORGEJO__actions__ENABLED: "true"
      # ROOT_URL matters: it's what the registry/clone URLs advertise. Traefik
      # terminates TLS for git.thefipster.de and forwards to this container's
      # :3000 over the shared `proxy` network (see infra/traefik).
      FORGEJO__server__ROOT_URL: "https://git.thefipster.de/"
      FORGEJO__server__DOMAIN: "git.thefipster.de"
      # Prometheus metrics at /metrics, on the SAME port as the web UI (3000).
      # NOTE: that port is what Traefik publishes at git.thefipster.de, so this
      # also makes https://git.thefipster.de/metrics readable by anyone on the
      # LAN, unauthenticated. That is DELIBERATE: the endpoint serves aggregate
      # counters (repository/user/issue totals), not code or credentials, and
      # the lab is LAN-only with no untrusted users.
      # To close it later, either set FORGEJO__metrics__TOKEN (and add a
      # bearer_token to Alloy's scrape), or add a higher-priority Traefik
      # router for PathPrefix(`/metrics`) with an ipAllowList of 127.0.0.1/32.
      # Alloy scrapes forgejo:3000 DIRECTLY over the proxy network, never
      # through Traefik, so neither change affects collection.
      FORGEJO__metrics__ENABLED: "true"
      # --- SSO (Authentik via OIDC) ----------------------------------------
      # These are INSTANCE-level settings, NOT fields on the "Add
      # Authentication Source" form — that form has neither, which is why the
      # SSO registry used to list them as clickwork that doesn't exist.
      #   ENABLE_AUTO_REGISTRATION: create the Forgejo user on first SSO login
      #     (default false, which otherwise rejects the login outright).
      #   ACCOUNT_LINKING=auto: link to an existing local account with the SAME
      #     EMAIL instead of creating a duplicate user (default "login", which
      #     stops at a manual link-account prompt). This is what maps your
      #     Authentik identity onto the Forgejo admin created at first run — so
      #     the two accounts must share an email address.
      # Local password login stays enabled regardless: it is the break-glass
      # path when Authentik is down. See docs/sso-applications.md.
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      FORGEJO__oauth2_client__ACCOUNT_LINKING: "auto"
    volumes:
      # Forgejo's state (repos, config, avatars…). Runs as UID/GID 1000, so
      # this dir must be chown'd to 1000:1000 — see the README setup step.
      - /opt/forgejo/forgejo:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "222:22"      # git over SSH (host 222 -> container 22), optional
    labels:
      traefik.enable: "true"
      traefik.http.routers.forgejo.rule: Host(`git.thefipster.de`)
      traefik.http.routers.forgejo.entrypoints: websecure
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"
    networks:
      - forgejo-net
      - proxy

  # ---------------------------------------------------------------------------
  # The Forgejo Actions runner. It must be REGISTERED once (see README) before
  # it will pick up jobs. It runs job containers on the HOST Docker daemon via
  # the mounted socket — simple, and builds reuse the host's image/layer cache.
  #
  # Trust tradeoff: mounting the socket gives jobs root-equivalent control of
  # host Docker. That's acceptable here because CI only builds YOUR OWN mirrored
  # repos (code you wrote). Do NOT use this pattern for untrusted / fork code —
  # switch to an isolated runner for that.
  # ---------------------------------------------------------------------------
  runner:
    # The runner has no LTS track, so this one follows the newest major — and
    # it must move whenever the server does. Forgejo 13 began validating
    # Actions workflows against a YAML schema server-side and runner 8 began
    # doing the same before starting a job; a runner from before that gate
    # paired with a server from after it disagree about what a valid workflow
    # is. Runner 12 additionally needs a `git` binary to fetch remote actions,
    # which this image ships.
    image: code.forgejo.org/forgejo/runner:12
    restart: unless-stopped
    depends_on:
      - forgejo
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID in .env — run: getent group docker | cut -d: -f3}"
    volumes:
      - /opt/forgejo/runner:/data
      # Runner config straight from the repo, read-only — the same convention
      # the monitoring stack uses for its configs, and the repo stays the
      # single source of truth. Mounted INSIDE /data because that is the path
      # the daemon is started with (--config /data/config.yml), so the config
      # and the registration state (.runner) sit together. This replaces the
      # manual `sudo cp config.yml /opt/forgejo/runner/` + chown step: edit
      # here, `git pull` on the VM, restart the runner.
      - ./config.yml:/data/config.yml:ro
      # Run job containers on the host's Docker daemon via the mounted socket.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forgejo-net
    # Only run the daemon once a .runner file exists (i.e. after registration).
    command: >
      sh -c '
        while [ ! -f /data/.runner ]; do
          echo "Waiting for runner registration (/data/.runner)...";
          sleep 5;
        done;
        forgejo-runner daemon --config /data/config.yml
      '

networks:
  forgejo-net:
    driver: bridge
  proxy:
    external: true
