# =============================================================================
# build-and-push.yml
#
# Place this in your VERDURE REPO at: .forgejo/workflows/build-and-push.yml
#
# This is the DEV builder: it builds whatever the mirror last synced and tags
# images by commit SHA. For a versioned release from a git tag, use
# release.yml instead.
#
# Because you chose GitHub-primary + Forgejo pull-mirror, a normal `on: push`
# will NOT fire (mirrors don't emit push events). Builds are therefore
# MANUAL-ONLY: after the mirror has synced, trigger the workflow from the
# repo's Actions tab (workflow_dispatch).
#
# Verdure is three toolchains, so this is three jobs — `container:` is a
# per-job setting, so .NET, PlatformIO and Node cannot share one. Each job is
# gated by its own dispatch input: the runner is `capacity: 1` (see
# infra/forgejo/config.yml), so everything you leave unticked is wall-clock
# you keep.
#
# Where each job's output ends up:
#   blazor    OCI image  -> container registry, git.thefipster.de/<repo>/blazor
#   firmware  *.bin      -> run artifact + generic package `verdure-firmware`
#   showcase  dist.tar.gz-> run artifact + generic package `verdure-showcase`
#
# `verdure-firmware` is ONE package for all three boards, deliberately: these
# versions are commit SHAs, and they must not land inside the per-component
# `verdure-atmos` / `verdure-terra` / `verdure-flux` packages, where
# release.yml publishes semver versions and `latest`.
#
# Paths, PlatformIO environments and the Astro directory below are
# PLACEHOLDERS — every one of them is marked, and they are the only things you
# should need to change to make this run against the real repo.
# =============================================================================

name: Build and Push (manual)

on:
  workflow_dispatch:
    # Booleans, all default-on: a bare dispatch still builds everything, the
    # way this workflow used to. Untick to iterate on one framework.
    inputs:
      build_blazor:
        description: "Build + push the Blazor image"
        type: boolean
        default: true
      build_firmware:
        description: "Build the PlatformIO firmware(s)"
        type: boolean
        default: true
      build_showcase:
        description: "Build the Astro showcase site"
        type: boolean
        default: true

# One place to change the host and the account, rather than the six string
# literals these replace.
env:
  FORGEJO_HOST: git.thefipster.de
  # The Forgejo account the registry pushes authenticate as. Its token lives in
  # the repo's secrets as REGISTRY_TOKEN and needs `write:package` — the SAME
  # scope covers the container registry and the generic registry, so the two
  # non-Docker jobs below need no secret of their own.
  REGISTRY_USER: felix

jobs:
  # ===========================================================================
  # 1. Blazor Server -> container image
  # ===========================================================================
  build-blazor:
    runs-on: docker
    # A `type: boolean` input can reach the runner as the STRING "false", and a
    # non-empty string is truthy — `if: inputs.build_blazor` would then run this
    # job with the box unticked. Compare against both forms explicitly. Same
    # guard on all three jobs.
    if: ${{ inputs.build_blazor == true || inputs.build_blazor == 'true' }}
    container:
      # This job runs Node actions (checkout, login, build-push) AND shells out
      # to the `docker` CLI. The plain `node` image has Node but no docker
      # binary, so `docker/login-action` fails with "docker: not found". The
      # catthehacker "act" images bundle Node + docker CLI + buildx (they mirror
      # GitHub's ubuntu-latest runner), which is what these actions expect.
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      # ---------------------------------------------------------------------
      # 1. Check out the mirrored code. fetch-depth: 0 = full clone, so build
      #    tooling can read tags/history if it wants to.
      # ---------------------------------------------------------------------
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # 2. Log in to the Forgejo container registry.
      #    The registry is served over HTTPS at the Forgejo host, so no
      #    insecure-registry configuration is needed anymore.
      # ---------------------------------------------------------------------
      - name: Log in to Forgejo registry
        uses: https://code.forgejo.org/docker/login-action@v3
        with:
          registry: ${{ env.FORGEJO_HOST }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: https://code.forgejo.org/docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # 3. Build the Blazor image from your Dockerfile and push it.
      #    Image name: git.thefipster.de/<owner>/<repo>:<tag>
      #    We tag both the short SHA and `latest`.
      # ---------------------------------------------------------------------
      - name: Build and push
        uses: https://code.forgejo.org/docker/build-push-action@v6
        with:
          context: ./src/dotnet
          file: ./src/dotnet/Fip.Verdure.Web/Dockerfile
          push: true
          tags: |
            ${{ env.FORGEJO_HOST }}/${{ github.repository }}/blazor:latest
            ${{ env.FORGEJO_HOST }}/${{ github.repository }}/blazor:${{ github.sha }}

  # ===========================================================================
  # 2. PlatformIO -> firmware.bin (+ filesystem image)
  #
  # A MATRIX, not a job per board: adding a third project is ONE ENTRY in the
  # list below and nothing else in this file changes. The runner is capacity: 1
  # so the legs run serially, but they stay independent — fail-fast is off, so
  # a board that won't compile doesn't cancel the others.
  # ===========================================================================
  build-firmware:
    runs-on: docker
    if: ${{ inputs.build_firmware == true || inputs.build_firmware == 'true' }}
    container:
      # PlatformIO publishes NO official Docker image — the ones on Docker Hub
      # are all community builds. Upstream's own documented CI recipe is a pip
      # install, so that is what this does. Pinned major.minor because the bare
      # `python:3` tag moves across minor releases. 3.14 needs PlatformIO core
      # >= 6.1.19 — satisfied here because the pip install below always takes
      # the latest core.
      image: python:3.14-bookworm
    strategy:
      fail-fast: false
      matrix:
        # ---- PLACEHOLDERS: one entry per PlatformIO project ----------------
        #   name        artifact/package prefix, must be unique
        #   dir         directory holding that project's platformio.ini
        #   pio_env     the [env:...] section to build
        #   filesystem  "littlefs" or "spiffs" to also build a filesystem
        #               image; "" to skip that step entirely
        project:
          - name: atmos
            dir: src/platformio/atmos
            pio_env: esp32dev
            filesystem: littlefs
          - name: terra
            dir: src/platformio/terra
            pio_env: esp32-c3-devkitm-1
            filesystem: ""
          - name: flux
            dir: src/platformio/flux
            pio_env: esp32-c3-devkitm-1
            filesystem: ""
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # PlatformIO downloads a full cross-toolchain (hundreds of MB) into
      # ~/.platformio on first use. Caching it is the difference between a
      # two-minute and a ten-minute run. The runner already has `cache:
      # enabled: true` in config.yml; this is what finally uses it.
      # Keyed on platformio.ini so a changed platform/lib_deps busts it.
      # ---------------------------------------------------------------------
      - name: Cache PlatformIO toolchain
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ matrix.project.name }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project.dir)) }}
          restore-keys: |
            pio-${{ matrix.project.name }}-

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # ---------------------------------------------------------------------
      # `pio run` writes into <dir>/.pio/build/<env>/. Two invocations because
      # the filesystem image is a separate target (`buildfs`) — it is NOT
      # produced by a plain build.
      # ---------------------------------------------------------------------
      - name: Build firmware
        run: pio run -d "${{ matrix.project.dir }}" -e "${{ matrix.project.pio_env }}"

      - name: Build filesystem image
        if: ${{ matrix.project.filesystem != '' }}
        run: pio run -d "${{ matrix.project.dir }}" -e "${{ matrix.project.pio_env }}" -t buildfs

      # ---------------------------------------------------------------------
      # Collect into one flat dir, prefixed by project name so two boards'
      # outputs never collide once they land in the same package version.
      # ---------------------------------------------------------------------
      - name: Stage artifacts
        run: |
          set -euo pipefail
          BUILD_DIR="${{ matrix.project.dir }}/.pio/build/${{ matrix.project.pio_env }}"
          mkdir -p dist-firmware
          cp "$BUILD_DIR/firmware.bin" "dist-firmware/${{ matrix.project.name }}-firmware.bin"
          if [ -n "${{ matrix.project.filesystem }}" ]; then
            cp "$BUILD_DIR/${{ matrix.project.filesystem }}.bin" \
               "dist-firmware/${{ matrix.project.name }}-${{ matrix.project.filesystem }}.bin"
          fi
          ls -l dist-firmware

      # ---------------------------------------------------------------------
      # STORAGE, part 1 — the run artifact. Browsable from this run's page in
      # the Actions tab, and it expires on its own. `forgejo/upload-artifact`
      # rather than `actions/upload-artifact`: the upstream v4 only speaks to
      # GitHub's own backend, so Forgejo maintains this fork.
      # Retention is explicit; the instance default is 90 days.
      # ---------------------------------------------------------------------
      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project.name }}
          path: dist-firmware/
          retention-days: 30

      # ---------------------------------------------------------------------
      # STORAGE, part 2 — the generic package registry: the same Packages tab
      # as the container images, but permanent and versioned. There is no
      # action for it, it is a plain HTTP PUT.
      #
      # Two things to know:
      #   * Generic packages are OWNER-scoped, not repo-scoped — hence the
      #     `verdure-` prefix, or another repo's `firmware` would collide.
      #   * A PUT over an existing filename returns 409. Re-dispatching the
      #     same commit is normal here (workflow_dispatch is the only trigger),
      #     so delete first and ignore the delete failing on a fresh version.
      # ---------------------------------------------------------------------
      - name: Publish to generic package registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://${{ env.FORGEJO_HOST }}/api/packages/${{ github.repository_owner }}/generic"
          VERSION="$(echo "${{ github.sha }}" | cut -c1-7)"
          for f in dist-firmware/*; do
            url="$BASE/verdure-firmware/$VERSION/$(basename "$f")"
            curl -sS --user "${{ env.REGISTRY_USER }}:$TOKEN" -X DELETE "$url" || true
            curl -sS --fail-with-body --user "${{ env.REGISTRY_USER }}:$TOKEN" \
                 --upload-file "$f" "$url"
            echo "published $url"
          done

  # ===========================================================================
  # 3. Astro -> static dist/, archived
  # ===========================================================================
  build-showcase:
    runs-on: docker
    if: ${{ inputs.build_showcase == true || inputs.build_showcase == 'true' }}
    container:
      # The runner's own default job image (config.yml), so it is already on
      # the host daemon. Node 24 is the current LTS (Node 20 went EOL
      # 2026-04-30); keep this tag and config.yml's label in step.
      image: code.forgejo.org/oci/node:24-bookworm
    # PLACEHOLDER: the Astro project's directory. Every step below runs in it.
    defaults:
      run:
        working-directory: src/astro
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # `npm ci` needs a committed package-lock.json and installs exactly it —
      # `npm install` would drift the build from the lockfile.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ---------------------------------------------------------------------
      # `-C dist .` archives the CONTENTS of dist/, not a `dist/` top-level
      # directory — so unpacking gives you the site root directly.
      # ---------------------------------------------------------------------
      - name: Archive dist
        run: tar -czf dist.tar.gz -C dist .

      - name: Upload artifact
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          # `path` is NOT affected by `defaults.run.working-directory` — that
          # only applies to `run:` steps — so this path is repo-relative.
          name: showcase
          path: src/astro/dist.tar.gz
          retention-days: 30

      # Same delete-then-put as the firmware job; see the comment there.
      - name: Publish to generic package registry
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://${{ env.FORGEJO_HOST }}/api/packages/${{ github.repository_owner }}/generic"
          VERSION="$(echo "${{ github.sha }}" | cut -c1-7)"
          url="$BASE/verdure-showcase/$VERSION/dist.tar.gz"
          curl -sS --user "${{ env.REGISTRY_USER }}:$TOKEN" -X DELETE "$url" || true
          curl -sS --fail-with-body --user "${{ env.REGISTRY_USER }}:$TOKEN" \
               --upload-file dist.tar.gz "$url"
          echo "published $url"
