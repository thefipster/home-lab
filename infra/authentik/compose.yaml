# Authentik — SSO identity provider for the INFRA VM.
#
# server + worker + a DEDICATED postgres (not shared with Forgejo, so the stack
# backs up and version-pins independently). Routed by Traefik at
# auth.thefipster.de under the one wildcard cert (no per-router TLS labels).
#
# There is NO redis service, and that is not an omission: Authentik dropped its
# Redis dependency entirely in 2025.10 (cache, tasks, the embedded outpost's
# session store and websockets all moved to Postgres). Adding one back would
# give the stack a container nothing connects to.
#
# This stack also declares — as labels on the `server` container — the pieces
# that let OTHER stacks use Authentik for forward-auth:
#   * the shared `authentik@docker` forwardauth middleware, and
#   * one /outpost.goauthentik.io/ router per protected host (dockge, traefik),
#     required because single-application forward auth runs its handshake on
#     each app's own domain.
# Deploy (on the infra VM): scripts/init-authentik.sh, fill .env, compose up -d.
# Authentik must be RUNNING before Dockge/Traefik reference authentik@docker,
# or Traefik logs an "undefined middleware" error and those routers won't load.

name: authentik

services:
  db:
    image: postgres:18-alpine        # major pin, same policy as the Forgejo DB
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      POSTGRES_DB: authentik
      # See infra/forgejo/compose.yaml: Postgres 18 made the image's default
      # PGDATA version-specific. Pinned back to the flat path so
      # /opt/authentik/postgres holds PGDATA directly. Upstream's own compose
      # still ships 16; Authentik supports 14–18, so 18 is in range.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - /opt/authentik/postgres:/var/lib/postgresql/data
    networks:
      - authentik-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/goauthentik/server:2026.5   # major.minor pin — breaking DB
    restart: unless-stopped                     # migrations between minors
    command: server
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      # akadmin is created on FIRST boot from these. Keep it as break-glass.
      # Set on BOTH server and worker — the WORKER applies the blueprint that
      # actually creates akadmin (see the worker's env below).
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set AUTHENTIK_BOOTSTRAP_PASSWORD in .env}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
    volumes:
      # /data, NOT /media. 2025.12 reworked file storage: uploads (app icons,
      # branding, flow backgrounds) live under /data/media and are served at
      # the /files prefix. The image ships /data/media as a symlink to /media
      # for compatibility; bind-mounting /data replaces it with the real thing,
      # which is what upstream's own compose does. Mount BOTH containers the
      # same way — the worker writes here too.
      - /opt/authentik/data:/data
      - /opt/authentik/templates:/templates
      - /opt/authentik/certs:/certs
    labels:
      traefik.enable: "true"
      # --- Authentik portal (auth.thefipster.de) ---------------------------
      traefik.http.routers.authentik.rule: Host(`auth.thefipster.de`)
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.services.authentik.loadbalancer.server.port: "9000"
      # --- Shared forward-auth middleware (referenced as authentik@docker) --
      # `authentik-server` is an explicit alias on the proxy network (declared
      # below). The default service-name alias (`server`) is too generic for a
      # network every stack joins — another stack's `server` would collide.
      traefik.http.middlewares.authentik.forwardauth.address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
      traefik.http.middlewares.authentik.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.authentik.forwardauth.authResponseHeaders: X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid
      # --- Per-host outpost-path routers (single-application forward auth) --
      # Each protected host must serve /outpost.goauthentik.io/ from the outpost
      # so the post-login callback lands on the app's own domain (else it 404s).
      traefik.http.routers.ak-outpost-dockge.rule: Host(`dockge.thefipster.de`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.ak-outpost-dockge.entrypoints: websecure
      traefik.http.routers.ak-outpost-dockge.service: authentik
      traefik.http.routers.ak-outpost-traefik.rule: Host(`traefik.thefipster.de`) && PathPrefix(`/outpost.goauthentik.io/`)
      traefik.http.routers.ak-outpost-traefik.entrypoints: websecure
      traefik.http.routers.ak-outpost-traefik.service: authentik
      # THREE HOSTS ARE DELIBERATELY ABSENT FROM THE LIST ABOVE, and none is an
      # oversight to fix:
      #   vault.thefipster.de  — Vaultwarden holds the credentials for
      #     repairing THIS stack, so it must stay reachable when this stack is
      #     not. It is also the only service in the lab with real OIDC support
      #     that declines to use it, for the same reason. /admin is not gated
      #     either: that is the page you would need in order to repair
      #     anything.
      #   uptime.thefipster.de — Kuma's whole job is telling you what is down,
      #     so gating it here would make an Authentik outage the one failure you
      #     cannot see.
      #   ha.thefipster.de     — forward auth would break Home Assistant's
      #     companion app, webhooks and every local API caller, which
      #     authenticate with tokens against the same endpoints a browser uses.
      # All three keep their own local login. The matching absences are missing
      # `middlewares` labels in infra/vaultwarden/compose.yaml and
      # infra/uptime-kuma/compose.yaml, and a missing `middlewares` key in
      # infra/traefik/dynamic/ha.yaml. Reasoning: docs/sso-applications.md.
    networks:
      authentik-net:
      proxy:
        aliases:
          - authentik-server

  worker:
    image: ghcr.io/goauthentik/server:2026.5   # must match `server` exactly
    restart: unless-stopped
    command: worker
    # No docker.sock mount: the embedded outpost runs in `server`, so the worker
    # manages no outpost containers — keep its privilege minimal.
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?set PG_PASS in .env}
      # Blueprints — including the one that CREATES akadmin on first boot —
      # are applied by the WORKER, not the server. Without these here, akadmin
      # is created with NO usable password and every login fails.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set AUTHENTIK_BOOTSTRAP_PASSWORD in .env}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
    volumes:
      - /opt/authentik/data:/data
      - /opt/authentik/templates:/templates
      - /opt/authentik/certs:/certs
    networks:
      - authentik-net

networks:
  authentik-net:
    driver: bridge
  proxy:
    external: true
