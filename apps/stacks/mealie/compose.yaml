# Mealie — recipe manager & meal planner
# Upstream reference: https://docs.mealie.io/documentation/getting-started/installation/postgres/
#
# Deployed on Coolify as a "Docker Compose" resource from this repository.
# Coolify magic variables used here:
#   SERVICE_URL_MEALIE_9000 -> generates the domain and points the proxy at port 9000
#   ${SERVICE_PASSWORD_*}   -> generated once, then stored in the resource's env editor
#
# State lives in bind mounts under /data/mealie on the apps VM — /data is the
# 300 GB second disk, the same one Coolify keeps its own store on (/data/coolify).
# Named volumes were deliberately dropped: a backup job needs a path it can walk.

services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      - SERVICE_URL_MEALIE_9000
      # Must match the domain configured under Coolify -> Domains, scheme included.
      # Not derived from SERVICE_URL_/SERVICE_FQDN_: whether those carry a scheme has
      # changed between Coolify versions, and a scheme-less BASE_URL breaks invite links.
      - BASE_URL=${PUBLIC_URL:-https://mealie.thefipster.de}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-false}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
      # Single-node home lab: one worker is plenty and keeps idle RAM low.
      - MAX_WORKERS=${MAX_WORKERS:-1}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      # First-run admin account. Change the password immediately after logging in.
      - DEFAULT_EMAIL=${DEFAULT_EMAIL:-changeme@example.com}
      - DEFAULT_GROUP=${DEFAULT_GROUP:-Home}
      - DEFAULT_HOUSEHOLD=${DEFAULT_HOUSEHOLD:-Family}
      # --- SSO (OIDC via Authentik) ---
      # Off until the Authentik provider exists; the stack deploys and runs fine
      # before it, which is how it is meant to be verified first. Same shape as
      # Grafana's GRAFANA_OIDC_ENABLED on the infra VM.
      - OIDC_AUTH_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_CONFIGURATION_URL=https://auth.thefipster.de/application/o/mealie/.well-known/openid-configuration
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-Authentik}
      # Only members of this Authentik group get in. Blank would admit every
      # authenticated user, which the application's access binding already scopes.
      - OIDC_USER_GROUP=${OIDC_USER_GROUP:-lab-users}
      # Deliberately blank: no Authentik group grants Mealie admin. Promote the
      # first account inside Mealie instead — one place, visible in its own UI.
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-}
      - OIDC_SIGNUP_ENABLED=${OIDC_SIGNUP_ENABLED:-true}
      # Authentik's default email scope mapping emits email_verified: true. If a
      # custom mapping ever drops it, every SSO login fails here rather than loudly.
      - OIDC_REQUIRES_EMAIL_VERIFICATION=${OIDC_REQUIRES_EMAIL_VERIFICATION:-true}
      # Local login stays enabled — break-glass when Authentik is down, matching
      # Forgejo and Grafana. Do not set this false without a second way in.
      - ALLOW_PASSWORD_LOGIN=${ALLOW_PASSWORD_LOGIN:-true}
      - DB_ENGINE=postgres
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - /data/mealie/data:/app/data
    deploy:
      resources:
        limits:
          memory: 1000M
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # 18, matching every other Postgres in the lab, rather than the 17 Mealie's own
    # example compose still ships. Nothing here depends on a version-specific feature.
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mealie
      - POSTGRES_USER=mealie
      - PGUSER=mealie
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # Postgres 18's image defaults PGDATA to a version-specific path
      # (/var/lib/postgresql/18/docker). Pinning it back keeps the bind mount
      # holding PGDATA directly, and makes a future major bump fail loudly
      # instead of initialising an empty 19/ beside the old data.
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - /data/mealie/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
