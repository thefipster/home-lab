# Home Assistant configuration — FRAGMENT, NOT A FILE TO COPY OVER.
#
# This lives inside the HA VM at /config/configuration.yaml, which this repo
# cannot mount: HAOS is an appliance with no shell of ours in it. So the repo
# holds the fragment and you paste it by hand. It is now the ONLY file here of
# that kind — the Forgejo workflow templates were the other one, and they were
# deleted once the real workflows existed in the app repo, because two copies of
# a live file drift. This fragment survives that argument for one reason: there
# is no repo it could live in instead.
#
# APPEND this block to the existing /config/configuration.yaml. Do NOT replace
# that file — a fresh HAOS install ships it with `default_config:` and
# overwriting it strips the entire default integration set. The key below is one
# HAOS does not define itself, so appending cannot collide.
#
# Edit it from HA's File Editor or Studio Code Server app, then
# Developer Tools -> YAML -> Restart.
#
# See docs/guides/home-assistant-setup.md.

# --- NO `http:` BLOCK, AND ADDING ONE IS AN ERROR ----------------------------
# This machine serves its own HTTPS: the Let's Encrypt app holds an exact
# certificate for ha.thefipster.de and HA listens on :443 itself, with nothing
# proxying it. That is port, certificate and key — three settings, and all three
# are UI settings.
#
# Home Assistant 2026.8 moved HTTP server configuration OUT of YAML and into
# Settings > System > Network. An `http:` block left in this file raises a
# REPAIR ISSUE telling you to delete it, so shipping one here would hand you a
# broken instruction. docs/guides/home-assistant-setup.md, step 7, has the
# click-path and the values.
#
# There is no `trusted_proxies` anywhere either, in YAML or in the UI: nothing
# proxies this machine, so there is no hop to trust. That was the last value in
# the lab that had to be written as a literal IP address rather than a name, and
# it left with the proxy. See docs/reference/dns-records.md.

# --- metrics ----------------------------------------------------------------
# Exposes /api/prometheus, scraped by Alloy on the infra VM as
# job="homeassistant". These are ENTITY metrics — sensor states, not machine
# counters — so they do not belong on the Node Exporter Full dashboard.
#
# System Monitor integration turns this VM's CPU/RAM/disk into entities, which
# then leave through this same endpoint — HAOS cannot run a node exporter as a
# systemd unit, so that is the equivalent. It is step 9 of
# docs/home-assistant-setup.md, not an optional extra: without it this machine
# contributes no host metrics at all.
#
# Unaffected by the 2026.8 move: only the `http:` integration became UI-managed,
# so this stays YAML and stays here.
#
# The endpoint requires a long-lived access token, minted in HA's own UI and
# stored in infra/monitoring/.env as HA_PROMETHEUS_TOKEN.
prometheus:
